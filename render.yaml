# Render Blueprint (field names checked against Render's Blueprint spec on 2026-11-24).
# No `plan` is set, so Render uses its default paid plan for new services (0.5c-512mb at the time of checking).
# SQLite needs the persistent disk below. Free services cannot be scaled or relied on for this; check Render's Disks docs.
services:
  - type: web
    name: arisu-office
    runtime: docker
    autoDeployTrigger: "off"   # push to GitHub does not redeploy by itself; deploy manually from the dashboard
    healthCheckPath: /api/health
    disk:
      name: arisu-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "true"
      - key: FB_PUBLISH_ENABLED
        value: "false"
      - key: SETUP_TOKEN
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: GCASH_NAME
        sync: false
      - key: GCASH_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
